name: Build and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true

      - name: Create fresh Flutter project and copy our code
        run: |
          # Create a temp project with correct platform files
          cd /tmp
          flutter create --platforms=android --org com.horror --project-name red_paper_umbrella temp_project
          # Remove default lib and pubspec
          rm -rf temp_project/lib
          rm temp_project/pubspec.yaml
          # Copy our code
          cd $GITHUB_WORKSPACE
          cp -r lib /tmp/temp_project/
          cp pubspec.yaml /tmp/temp_project/
          # Copy assets if they exist
          if [ -d assets ]; then
            cp -r assets /tmp/temp_project/
          fi
          # Replace the entire project with our code + fresh platform files
          cd /tmp/temp_project
          cp -r * $GITHUB_WORKSPACE/

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --no-tree-shake-icons --no-shrink

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true

      - name: Create fresh Flutter project and copy our code
        run: |
          # Create a temp project with correct platform files
          cd /tmp
          flutter create --platforms=ios --org com.horror --project-name red_paper_umbrella temp_project
          # Remove default lib and pubspec
          rm -rf temp_project/lib
          rm temp_project/pubspec.yaml
          # Copy our code
          cd $GITHUB_WORKSPACE
          cp -r lib /tmp/temp_project/
          cp pubspec.yaml /tmp/temp_project/
          # Copy assets if they exist
          if [ -d assets ]; then
            cp -r assets /tmp/temp_project/
          fi
          # Replace the entire project with our code + fresh platform files
          cd /tmp/temp_project
          cp -r * $GITHUB_WORKSPACE/

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (No code sign)
        run: |
          flutter build ios --release --no-codesign --no-tree-shake-icons
          # Package as IPA
          cd build/ios/iphoneos
          mkdir -p Payload
          if [ -d Runner.app ]; then
            cp -r Runner.app Payload/
            zip -r RedPaperUmbrella.ipa Payload
          fi

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/RedPaperUmbrella.ipa
        continue-on-error: true

  release:
    name: Create Release
    needs: [build-android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release/

      - name: Download iOS IPA (if available)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-ipa
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          tag_name: v1.0.0
          name: 红纸伞 v1.0.0
          body: |
            ## 红纸伞 - 纸嫁衣风格2D恐怖解谜游戏
            
            ### 下载
            - **Android**: 下载 APK 文件安装（使用debug签名，可直接安装）
            - **iOS**: IPA 需要通过 AltStore/Sideloadly 等工具自签名安装
            
            ### 游戏特色
            - 图片剧情点击解谜游戏（点击场景物品拾取道具）
            - 手绘恐怖场景（CustomPainter程序化渲染）
            - 物品栏系统，支持拾取、使用、组合道具
            - 血条（生命值）和理智值双系统
            - 大量突脸惊吓（Jumpscare）带音效和震动
            - 体感解谜支持（陀螺仪+手动模式双选项）
            - 30秒广告获取提示系统
            - Material 3 暗黑恐怖主题
            - 第一章完整剧情体验
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
