name: Build and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --no-tree-shake-icons --no-shrink

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (No code sign)
        run: |
          flutter build ipa --release --no-codesign --no-tree-shake-icons

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa

  release:
    name: Create Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release/

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.apk
            release/*.ipa
          tag_name: v1.0.0
          name: 红纸伞 v1.0.0
          body: |
            ## 红纸伞 - 纸嫁衣风格2D恐怖解谜游戏
            
            ### 下载
            - Android: 下载 APK 文件安装
            - iOS: 下载 IPA 文件后通过 AltStore/Sideloadly 等工具安装
            
            ### 游戏特色
            - 图片剧情点击解谜游戏（非文字游戏）
            - 精美手绘恐怖场景
            - 物品拾取和道具使用系统
            - 血条和理智值系统
            - 突脸惊吓效果
            - 体感解谜（陀螺仪+手动模式）
            - 第一章完整剧情
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
