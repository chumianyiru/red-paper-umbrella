name: red_paper_umbrella
description: 红纸伞 - 纸嫁衣风格2D恐怖解谜游戏
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  sensors_plus: ^4.0.2
  audioplayers: ^5.2.1
  video_player: ^2.8.2
  path_provider: ^2.1.1
  vibration: ^1.8.4
  shake: ^2.2.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/characters/
    - assets/images/scenes/
    - assets/images/items/
    - assets/images/ui/
    - assets/images/jumpscares/
    - assets/audio/
    - assets/audio/bgm/
    - assets/audio/sfx/
    - assets/audio/jumpscares/
    - assets/video/
    - assets/raw/
