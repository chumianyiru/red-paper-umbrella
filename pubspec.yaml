name: red_paper_umbrella
description: "红纸伞 - 纸嫁衣风格2D恐怖解谜游戏"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  audioplayers: ^5.2.1
  sensors_plus: ^3.0.0
  vibration: ^1.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/characters/
    - assets/images/items/
    - assets/images/backgrounds/
    - assets/images/ui/
    - assets/images/jumpscares/
    - assets/images/cg/
    - assets/images/videos/
    - assets/images/gifs/
    - assets/audio/bgm/
    - assets/audio/sfx/
    - assets/audio/jumpscares/
    - assets/audio/jumpscare/
    - assets/audio/voice/
