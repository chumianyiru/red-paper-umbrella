name: red_paper_umbrella
description: "红纸伞 - 纸嫁衣风格2D恐怖解谜游戏"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  audioplayers: ^5.2.1
  sensors_plus: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/chapter1/
    - assets/audio/
    - assets/audio/bgm/
    - assets/audio/sfx/
    - assets/audio/voice/
